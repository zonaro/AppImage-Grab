<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gear Lever Grab</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">↓</span><div>
      <h1>Gear Lever Grab</h1><p>AppImage → Gear Lever</p>
    </div></header>
    <section class="toggle">
      <div><strong>Integração automática</strong><small id="description">Desativada</small></div>
      <label class="switch">
        <input id="enabled" type="checkbox" role="switch" aria-label="Ativar integração automática">
        <span class="track"></span>
      </label>
    </section>
    <section class="history"><strong>Última atividade</strong><p id="activity" role="status">Nenhuma atividade ainda.</p></section>
    <footer>Com ON, AppImages baixadas via HTTPS são integradas ao Gear Lever. O app baixado não é iniciado automaticamente.</footer>
  </main>
</body>
</html>
