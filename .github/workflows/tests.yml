name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate extension JavaScript
        run: |
          node --check extension/common/background.js
          node --check extension/common/notifications.js
          node --check extension/common/activity-log.js
          node --check extension/common/activity-history.js
          node scripts/test-activity-history.mjs
          node --check extension/common/notification-settings.js
          node --check extension/common/native-client.js
          node --check extension/common/i18n.js
          node --check extension/common/manager.js
          node --check extension/common/store-catalog.js
          node --check extension/common/store.js
          node --check extension/common/update-check.js
          node --check extension/common/popup.js
          node scripts/test-update-check.mjs
          node scripts/test-manager-ui.mjs
          node scripts/test-backend-routing.mjs
          node scripts/test-rebrand.mjs
          node scripts/test-install-click.mjs
          node scripts/test-popup-errors.mjs
          node scripts/test-store.mjs
          node scripts/test-integration-notifications.mjs
          node scripts/test-notifications.mjs
          node scripts/test-notification-icons.mjs
          node scripts/test-notification-ui.mjs
          node --check extension/common/page-offers.js
          node --check extension/common/page-offer-background.js
          node scripts/test-page-offers.mjs
      - name: Check PNG icon integrity
        run: python3 scripts/check-icons.py extension/common/icons
      - name: Shell syntax and build unpacked extensions
        run: |
          bash -n install.sh uninstall.sh scripts/build-extensions.sh
          bash scripts/build-extensions.sh
          node scripts/test-i18n.mjs
          test -d dist/chromium
          test -d dist/firefox
          test ! -e dist/packages
      - name: Validate manifests, commit stamps, and local guide
        run: |
          python3 -m json.tool dist/chromium/manifest.json >/dev/null
          python3 -m json.tool dist/firefox/manifest.json >/dev/null
          test -f dist/chromium/manager.html
          test -f dist/chromium/store-catalog.js
          test -f dist/chromium/store.js
          test -f dist/chromium/native-client.js
          test -f dist/chromium/notifications.js
          test -f dist/chromium/activity-log.js
          test -f dist/chromium/activity-history.js
          test -f dist/chromium/notification-settings.js
          test -f dist/chromium/update-check.js
          test -f dist/chromium/build-revision.js
          test -f dist/chromium/version.json
          test -f dist/firefox/manager.html
          test -f dist/firefox/store-catalog.js
          test -f dist/firefox/store.js
          test -f dist/firefox/native-client.js
          test -f dist/firefox/notifications.js
          test -f dist/firefox/activity-log.js
          test -f dist/firefox/activity-history.js
          test -f dist/firefox/notification-settings.js
          test -f dist/firefox/build-revision.js
          test -f dist/chromium/page-offers.js
          test -f dist/chromium/page-offer-background.js
          test -f dist/firefox/page-offers.js
          test -f dist/firefox/page-offer-background.js
          test -f dist/chromium/icons/icon-16.png
          test -f dist/chromium/icons/icon-32.png
          test -f dist/chromium/icons/icon-48.png
          test -f dist/firefox/icons/icon-48.png
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from scripts.manifest_version import versions_for
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          commit_iso = subprocess.check_output(['git', 'show', '-s', '--format=%cI', 'HEAD'], text=True).strip()
          expected_version, expected_display = versions_for(commit_iso)
          for family in ('chromium', 'firefox'):
              source = json.loads(Path('extension', family, 'manifest.json').read_text())
              built = json.loads(Path('dist', family, 'manifest.json').read_text())
              assert re.fullmatch(r'\d+\.\d+\.\d+', source['version']), source['version']
              assert built['version'] == expected_version, (family, built['version'])
              assert built['version_name'] == expected_display, (family, built['version_name'])
          for path in ('version.json', 'dist/chromium/version.json', 'dist/firefox/version.json'):
              assert json.loads(Path(path).read_text())['commit'] == head
          for family in ('chromium','firefox'):
              assert head in Path('dist', family, 'build-revision.js').read_text()
          PY
          python3 scripts/generate_install_guide.py \
            --output /tmp/appimage-grab-guide.html \
            --chromium dist/chromium \
            --firefox-manifest dist/firefox/manifest.json \
            --commit "$(git rev-parse HEAD)"
          test -f /tmp/appimage-grab-guide.html
          grep -q 'id="copy-path"' /tmp/appimage-grab-guide.html
          grep -q 'id="copy-url"' /tmp/appimage-grab-guide.html
          test ! -e dist/packages
